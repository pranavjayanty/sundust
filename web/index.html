<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sundust</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230c0908'/><circle cx='50' cy='56' r='22' fill='%23ffb627'/><circle cx='50' cy='56' r='30' fill='none' stroke='%23ff5136' stroke-width='3' opacity='.65'/></svg>">
</head>
<body>

<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
      <defs><radialGradient id="s" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#ffe9a8"/><stop offset="45%" stop-color="#ffb627"/>
        <stop offset="100%" stop-color="#ff5136"/>
      </radialGradient></defs>
      <circle cx="22" cy="22" r="10" fill="url(#s)"/>
      <circle cx="22" cy="22" r="15" fill="none" stroke="#ff7a1a" stroke-width="1" opacity=".55"/>
      <circle cx="22" cy="22" r="20" fill="none" stroke="#ff5136" stroke-width="1" opacity=".28"/>
    </svg>
    <div>
      <h1>Sundust</h1>
      <p id="tagline">reading your projects…</p>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar-actions">
    <button class="btn attention" id="btn-attention" hidden></button>
    <button class="btn" id="btn-palette"><kbd>⌘K</kbd></button>
    <button class="btn primary" id="btn-new">New project</button>
  </div>
</header>

<main>
  <div id="warn"></div>

  <section class="sky">
    <canvas id="field"></canvas>
    <div class="sky-axis"><span>← hot · worked on just now</span><span>cool · dormant →</span></div>
    <div class="sky-legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <section class="asks" id="asks"></section>
  <section class="deck" id="deck"></section>
  <section class="adoptable" id="adoptable"></section>

  <section class="limits-wrap">
    <div class="sec"><span class="lbl">harness limits</span></div>
    <input class="lim-search" id="lim-search" placeholder="Search limits — try “weekly”, “context”, “free tier”, “output”…" autocomplete="off">
    <div class="lim-table" id="lim-table"></div>
    <div class="lim-note" id="lim-note"></div>
  </section>

  <footer class="foot" id="foot"></footer>
</main>

<dialog class="sheet" id="dlg-new">
  <h2>New project</h2>
  <p class="sub">Scaffolds the folder, writes an agent brief it can work from, loads its agenda, then opens your harness with a starter prompt.</p>
  <label class="field"><span>Name</span><input id="new-name" placeholder="Cooking notebook" autocomplete="off"></label>
  <div class="tpl" id="new-templates"></div>
  <label class="field"><span>Harness</span><select id="new-harness"></select></label>
  <p class="hint-line" id="harness-hint"></p>
  <label class="field"><span>Autonomy</span>
    <select id="new-autonomy">
      <option value="read" selected>read — scheduled runs may look and report, never edit</option>
      <option value="edit">edit — scheduled runs may change files in this project</option>
      <option value="off">off — nothing runs unattended</option>
    </select>
  </label>
  <p class="path-preview" id="new-path"></p>
  <div class="row end">
    <button class="btn" data-close>Cancel</button>
    <button class="btn primary" id="new-create">Create &amp; open</button>
  </div>
</dialog>

<dialog class="palette" id="dlg-palette">
  <input id="pal-input" placeholder="Jump to a session, run a task, look up a limit, start something new…" autocomplete="off">
  <div class="pal-list" id="pal-list"></div>
</dialog>

<dialog class="sheet" id="dlg-run">
  <h2>Run now</h2>
  <p class="sub" id="run-sub"></p>
  <label class="field"><span>What should it do?</span><textarea id="run-prompt" rows="5" placeholder="Check for anything new and summarise what changed."></textarea></label>
  <div class="row end">
    <button class="btn" data-close>Cancel</button>
    <button class="btn primary" id="run-go">Run headless</button>
  </div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
