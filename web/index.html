<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sundust</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0b0c'/><circle cx='16' cy='16' r='5.5' fill='%23ffb020'/></svg>">
<script>
  try { const t = localStorage.getItem('sundust-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header class="bar">
  <div class="wrap bar-in">
    <div class="word"><span class="dot"></span>Sundust</div>
    <div class="bar-actions">
      <button class="btn icon" id="btn-theme" title="Toggle theme (t)" aria-label="Toggle theme"></button>
      <button class="btn" id="btn-palette" title="Command palette"><kbd>⌘K</kbd></button>
      <button class="btn solid" id="btn-new">New project</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="warn"></div>
  <section class="counts" id="counts"></section>
  <section class="usage" id="usage"></section>

  <section class="review" id="review-sec" hidden>
    <div class="sechead">
      <canvas class="secmark" data-mark="rings"></canvas>
      <span class="lbl">Review · edits made while you were away</span>
      <span class="spacer"></span>
      <span class="tag" id="review-count"></span>
    </div>
    <div id="review"></div>
  </section>

  <section class="roster">
    <div class="sechead">
      <canvas class="secmark" data-mark="dots"></canvas>
      <span class="lbl">Projects</span>
      <input class="filter" id="filter" placeholder="Filter by name or path…" autocomplete="off">
      <span class="tag" id="roster-count"></span>
    </div>
    <div id="tbl"></div>
  </section>

  <section class="sched">
    <div class="sechead">
      <canvas class="secmark" data-mark="hatch"></canvas>
      <span class="lbl">Schedule · next 7 days</span>
      <span class="spacer"></span>
      <span class="tag" id="sched-count"></span>
    </div>
    <div id="sched"></div>
  </section>

  <section class="panels" id="panels"></section>
  <section id="adoptable" style="padding-top:var(--s6)"></section>
  <footer class="foot" id="foot"></footer>
</main>

<dialog class="sheet" id="dlg-new">
  <h2>New project</h2>
  <p class="sub">Scaffolds the folder, writes a brief the agent works from, loads its agenda, then opens your harness with a starter prompt.</p>
  <label class="field"><span>Name</span><input id="new-name" placeholder="Cooking notebook" autocomplete="off"></label>
  <div class="tpl" id="new-templates"></div>
  <label class="field"><span>Harness</span><select id="new-harness"></select></label>
  <p class="hint-line" id="harness-hint"></p>
  <label class="field"><span>Autonomy</span>
    <select id="new-autonomy">
      <option value="read" selected>read — scheduled runs may look and report, never edit</option>
      <option value="edit">edit — scheduled runs may change files in this project</option>
      <option value="off">off — nothing runs unattended</option>
    </select>
  </label>
  <p class="path-preview" id="new-path"></p>
  <div class="row end"><button class="btn" data-close>Cancel</button>
    <button class="btn solid" id="new-create">Create &amp; open</button></div>
</dialog>

<dialog class="palette" id="dlg-palette">
  <input id="pal-input" placeholder="Jump to a session, run a task, start something new…" autocomplete="off">
  <div class="pal-list" id="pal-list"></div>
</dialog>

<dialog class="sheet" id="dlg-run">
  <h2>Run now</h2>
  <p class="sub" id="run-sub"></p>
  <label class="field"><span>What should it do?</span><textarea id="run-prompt" rows="5" placeholder="Check for anything new and summarise what changed."></textarea></label>
  <div class="row end"><button class="btn" data-close>Cancel</button>
    <button class="btn solid" id="run-go">Run headless</button></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
